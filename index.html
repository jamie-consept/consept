<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Consept — Design for things that ought to last</title>
    <meta
      name="description"
      content="Consept is a small design studio working with purpose-led businesses, charities and projects building toward a more sustainable, conscious future. Brand, product and experience — physical and digital."
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400;1,9..40,500&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#13140F" />
    <meta property="og:title" content="Consept — Design for things that ought to last" />
    <meta
      property="og:description"
      content="A small design studio working with purpose-led businesses, charities and projects building toward a more sustainable, conscious future."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://consept.io" />

    <!-- Pre-paint theme script. Runs before <body> renders so the correct
         palette is applied before first paint, preventing a flash of the
         wrong theme. Default is dark; user's localStorage choice overrides. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('consept-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // localStorage unavailable — fall back to default (dark)
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
